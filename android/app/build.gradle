plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.jarves.ai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jarves.ai'
        minSdk 24
        targetSdk 35
        versionCode 252
        versionName '2.5.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs {
            pickFirsts += ['**/liblitertlm_jni.so']
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.0'
}
